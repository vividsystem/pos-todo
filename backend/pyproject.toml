[project]
name = "pos-todo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.2",
    "markdown-it-py[linkify]>=4.0.0",
    "paho-mqtt>=2.1.0",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.11.0",
    "python-escpos[all]>=3.1",
]


[depency-groups]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"

[tool.uv]
